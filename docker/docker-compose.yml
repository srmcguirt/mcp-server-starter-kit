version: '3.8'

services:
  mcp-server:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: production
    image: mcp-server-starter:latest
    container_name: mcp-server
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - LOG_LEVEL=info
      - RATE_LIMIT_MAX_REQUESTS=60
      - RATE_LIMIT_WINDOW_MS=60000
      # Add your env vars:
      # - MY_API_KEY=${MY_API_KEY}
    env_file:
      - ../.env
    stdin_open: true   # Required for stdio MCP transport
    tty: false
    read_only: true    # Security: read-only filesystem
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    cpus: '0.5'

  # Optional: Add your dependencies here
  # redis:
  #   image: redis:7-alpine
  #   restart: unless-stopped
